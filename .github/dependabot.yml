# Keeps pinned versions current (Phase 13): base images are pinned by digest, so without this
# they would never receive security patches. Python dependencies are locked with uv and hashes,
# a format Dependabot does not update; pip-audit in CI flags any vulnerable Python package, and
# they are upgraded with the uv command at the top of backend/requirements.txt.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  # PostgreSQL (Phase 15: db/Dockerfile). Same-major digests only: a new major version cannot
  # open an existing data directory; it needs a dump and restore (docs/deployment.md).
  - package-ecosystem: docker
    directory: /db
    schedule: { interval: weekly }
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
