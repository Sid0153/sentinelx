name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, dependency audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database that exists only for this job; not a real secret.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: sentinelx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sentinelx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-throwaway@127.0.0.1:5432/sentinelx_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Dependency audit (pip-audit, runtime and dev lockfiles)
        run: |
          pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off
      - name: Lint (ruff, including bandit-style security rules)
        run: ruff check .
      - name: Formatting (ruff format)
        run: ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests with coverage (fails under 90%)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, build, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit (npm audit, moderate and above)
        run: npm audit --audit-level=moderate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (with coverage floors, vite.config.ts)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, so a secret removed later is still found
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --no-banner --redact

  docker-stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with generated throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=$(openssl rand -hex 24)/" .env
      - name: Build and start the stack (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Backend liveness (direct)
        run: curl -fsS http://127.0.0.1:8001/api/health | grep -q '"status":"ok"'
      - name: Readiness through nginx (proxy, database and migrations)
        run: >-
          curl -fsS http://127.0.0.1:8081/api/ready
          | grep -q '"checks":{"database":"up","migrations":"current"}'
      - name: Frontend serves the app, including deep links
        run: curl -fsS http://127.0.0.1:8081/status | grep -q "<title>SentinelX</title>"
      - name: Startup configuration check passed and logs are JSON
        run: |
          docker compose logs backend | grep -q "Configuration OK"
          docker compose logs --no-log-prefix backend | grep '"msg": "app.starting"' | python3 -m json.tool > /dev/null
      - name: Errors use the documented shape and carry a request ID
        run: >-
          curl -s http://127.0.0.1:8081/api/does-not-exist
          | python3 -c "import json,sys; e=json.load(sys.stdin)['error']; assert e['code']=='not_found' and e['request_id']"
      - name: Containers run hardened (non-root, read-only, no capabilities)
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
          ! docker compose exec -T backend touch /app/probe
          ! docker compose exec -T frontend touch /usr/share/nginx/html/probe
          docker compose exec -T backend grep -q "CapEff:.0000000000000000" /proc/self/status
      - name: Security headers are served
        run: |
          page="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8081/)"
          echo "$page" | grep -qi "content-security-policy: default-src 'self'"
          echo "$page" | grep -qi "x-frame-options: DENY"
          api="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8081/api/health)"
          echo "$api" | grep -qi "cache-control: no-store"
      - name: Sign-in, roles and the audit trail work end to end (through nginx)
        run: |
          admin_password="$(openssl rand -hex 16)"
          echo "$admin_password" > /tmp/admin_password
          docker compose exec -T -e SENTINELX_ADMIN_PASSWORD="$admin_password" backend             python -m app.cli create-admin --email admin@ci.example
          python3 scripts/auth_smoke.py http://127.0.0.1:8081 admin@ci.example "$admin_password"
      - name: Two-factor sign-in, admin resets and the audit hash chain work end to end (through nginx)
        run: python3 scripts/security_smoke.py http://127.0.0.1:8081 admin@ci.example "$(cat /tmp/admin_password)"
      - name: Ingestion, detection, alerts and incidents work end to end (API through nginx, scenarios via CLI)
        run: |
          python3 scripts/ingest_smoke.py http://127.0.0.1:8081 admin@ci.example "$(cat /tmp/admin_password)"
          docker compose exec -T backend python -m app.cli create-source --name ci-auth --type linux_auth
          docker compose exec -T backend python -m app.cli demo-ingest --scenario brute_force --source ci-auth \
            | tee /tmp/demo.txt
          grep -q "parsed 12, skipped 12, failed 0" /tmp/demo.txt
          grep -q "PROCESSED, 1 detections, 1 new alerts" /tmp/demo.txt  # AUTH-001 → one alert
          grep -q "0 new incidents" /tmp/demo.txt  # a lone medium alert opens no incident
          docker compose exec -T backend python -m app.cli demo-ingest --scenario multi_stage_attack \
            --source ci-auth --host ci-web-02 --source-ip 198.51.100.200 | tee /tmp/chain.txt
          grep -q "1 new incidents" /tmp/chain.txt  # the whole chain is one story
      - name: The application connects as a least-privilege database role
        run: |
          docker compose logs backend | grep -q "Runtime role sentinelx_app"
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "select usename from pg_stat_activity where datname = current_database() and pid <> pg_backend_pid()"' | tr -d '\r' | sort -u > /tmp/db_users.txt
          cat /tmp/db_users.txt
          test "$(cat /tmp/db_users.txt)" = "sentinelx_app"
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "select rolsuper from pg_roles where rolname = '"'"'sentinelx_app'"'"'"' | tr -d '\r' | grep -qx f
      - name: Hardening (Phase 13) holds on the running stack
        run: |
          # The page's CSP allows no inline styles or scripts.
          ! curl -fsS -D - -o /dev/null http://127.0.0.1:8081/ | grep -qi "unsafe-inline"
          curl -fsS -D - -o /dev/null http://127.0.0.1:8081/ | grep -qi "strict-transport-security: max-age=31536000; includeSubDomains"
          # Query strings (search values, hunt definitions) never reach the proxy log.
          curl -s -o /dev/null "http://127.0.0.1:8081/events?username=ci-private-user"
          ! docker compose logs frontend | grep -q "ci-private-user"
          # The backend refuses an oversized body itself, even with nginx bypassed.
          head -c 2000000 /dev/zero > /tmp/big.json
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @/tmp/big.json http://127.0.0.1:8001/api/hunt/query)"
          test "$code" = "413"
          # A log shipper ingests with its source's key (no user account), through nginx.
          docker compose exec -T backend python -m app.cli issue-ingest-key --source ci-auth | tr -d '\r' > /tmp/key_output.txt
          source_id="$(sed -n 's/^Source ID: //p' /tmp/key_output.txt)"
          tail -n 1 /tmp/key_output.txt > /tmp/ingest_key
          echo "$(date -u +%Y-%m-%dT%H:%M:%S+00:00) ci-host sshd[1]: Failed password for root from 203.0.113.9 port 1 ssh2" > /tmp/line.txt
          # The header comes from a file: the key stays out of the command line (and gitleaks).
          printf 'X-Ingest-Key: %s\n' "$(cat /tmp/ingest_key)" > /tmp/key_header
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H @/tmp/key_header -H 'Content-Type: text/plain' --data-binary @/tmp/line.txt "http://127.0.0.1:8081/api/ingest/$source_id")"
          test "$code" = "201"
          printf 'X-Ingest-Key: sxk_wrong\n' > /tmp/wrong_key_header
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H @/tmp/wrong_key_header -H 'Content-Type: text/plain' --data-binary @/tmp/line.txt "http://127.0.0.1:8081/api/ingest/$source_id")"
          test "$code" = "401"
          # Database connections use TLS 1.3 with a verified certificate; plaintext is refused.
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "select distinct s.ssl, s.version from pg_stat_activity a join pg_stat_ssl s using (pid) where a.datname = current_database() and a.pid <> pg_backend_pid()"' | tr -d '\r' > /tmp/db_tls.txt
          cat /tmp/db_tls.txt
          test "$(cat /tmp/db_tls.txt)" = "t|TLSv1.3"
          ! docker compose exec -T backend python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL'].replace('postgresql+psycopg', 'postgresql').split('?')[0] + '?sslmode=disable')"
          # The backend container holds the CA certificate only, never the server key.
          ! docker compose exec -T backend test -e /tls/server.key
          # The tamper-evident audit chain verifies.
          docker compose exec -T backend python -m app.cli verify-audit
      - name: A forged X-Forwarded-For does not escape the login rate limit
        run: |
          for path in 8081 8001; do  # through nginx, and straight to the backend port
            for i in $(seq 1 11); do
              code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:$path/api/auth/login                 -H 'Content-Type: application/json' -H "X-Forwarded-For: 198.51.100.$i"                 -d '{"email":"nobody@example.com","password":"wrong-password-123"}')"
            done
            echo "port $path, 11th attempt: $code"
            test "$code" = "429"
          done
      - name: No secret appears in the logs
        run: |
          logs="$(docker compose logs --no-color)"
          for secret in "$(grep ^POSTGRES_PASSWORD= .env | cut -d= -f2)"                         "$(grep ^SECRET_KEY= .env | cut -d= -f2)" "$(grep ^APP_DB_PASSWORD= .env | cut -d= -f2)" "$(cat /tmp/admin_password)"                         "$(cat /tmp/ingest_key)"; do
            ! echo "$logs" | grep -qF "$secret"
          done
      - name: Readiness reports a database outage (and recovers)
        run: |
          docker compose stop db
          code="$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 15 http://127.0.0.1:8001/api/ready)"
          cat /tmp/ready.json; echo
          test "$code" = "503"
          grep -q '"database":"down"' /tmp/ready.json
          docker compose start db
          for attempt in $(seq 1 30); do
            curl -fs http://127.0.0.1:8001/api/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
