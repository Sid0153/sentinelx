name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, dependency audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database that exists only for this job; not a real secret.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: sentinelx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sentinelx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-throwaway@127.0.0.1:5432/sentinelx_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies (hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Dependency audit (pip-audit, runtime and dev lockfiles)
        run: |
          pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off
      - name: Lint (ruff, including bandit-style security rules)
        run: ruff check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests with coverage (fails under 90%)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, build, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit (npm audit, moderate and above)
        run: npm audit --audit-level=moderate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, so a secret removed later is still found
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  docker-stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a generated throwaway password
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
      - name: Build and start the stack (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Backend liveness (direct)
        run: curl -fsS http://127.0.0.1:8001/api/health | grep -q '"status":"ok"'
      - name: Readiness through nginx (proxy, database and migrations)
        run: >-
          curl -fsS http://127.0.0.1:8081/api/ready
          | grep -q '"checks":{"database":"up","migrations":"current"}'
      - name: Frontend serves the app, including deep links
        run: curl -fsS http://127.0.0.1:8081/status | grep -q "<title>SentinelX</title>"
      - name: Startup configuration check passed and logs are JSON
        run: |
          docker compose logs backend | grep -q "Configuration OK"
          docker compose logs --no-log-prefix backend | grep '"msg": "app.starting"' | python3 -m json.tool > /dev/null
      - name: Errors use the documented shape and carry a request ID
        run: >-
          curl -s http://127.0.0.1:8081/api/does-not-exist
          | python3 -c "import json,sys; e=json.load(sys.stdin)['error']; assert e['code']=='not_found' and e['request_id']"
      - name: Containers run hardened (non-root, read-only, no capabilities)
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
          ! docker compose exec -T backend touch /app/probe
          ! docker compose exec -T frontend touch /usr/share/nginx/html/probe
          docker compose exec -T backend grep -q "CapEff:.0000000000000000" /proc/self/status
      - name: Security headers are served
        run: |
          page="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8081/)"
          echo "$page" | grep -qi "content-security-policy: default-src 'self'"
          echo "$page" | grep -qi "x-frame-options: DENY"
          api="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8081/api/health)"
          echo "$api" | grep -qi "cache-control: no-store"
      - name: Database password never appears in the logs
        run: |
          password="$(grep ^POSTGRES_PASSWORD= .env | cut -d= -f2)"
          ! docker compose logs --no-color | grep -qF "$password"
      - name: Readiness reports a database outage (and recovers)
        run: |
          docker compose stop db
          code="$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 15 http://127.0.0.1:8001/api/ready)"
          cat /tmp/ready.json; echo
          test "$code" = "503"
          grep -q '"database":"down"' /tmp/ready.json
          docker compose start db
          for attempt in $(seq 1 30); do
            curl -fs http://127.0.0.1:8001/api/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
