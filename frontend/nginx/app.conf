# What every SentinelX site serves, over plain http (nginx.conf, development) or https
# (nginx-tls.conf, the production configuration): included by both, so the security headers
# and routing cannot drift apart.

server_tokens off;  # do not advertise the nginx version
access_log /dev/stdout sentinelx;
# Log ingestion (Phase 5) accepts batches up to 5 MB; everything else is small JSON.
client_max_body_size 6m;
root /usr/share/nginx/html;
index index.html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HTTPS only from now on for this host (Phase 13). Browsers ignore it over plain http (local
# development); over https (production configuration) it pins every later visit to https.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Log content shown in the UI is attacker-controlled (docs/security.md), so scripts and styles
# may only come from this origin. No 'unsafe-inline' (Phase 13): the build has no inline
# <style> or style attributes, and React's style props go through the CSSOM, which CSP allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# API calls are proxied to the backend container, so the browser only talks to one origin.
location /api/ {
  proxy_pass http://backend:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
}

# Single-page app: unknown paths fall back to index.html so React Router can handle them.
location / {
  try_files $uri /index.html;
}
