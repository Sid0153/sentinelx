# Access log without query strings (Phase 13): the event explorer's filters and the hunt page's
# definition travel in the query (usernames, addresses, hunt filters) and must not end up in
# proxy logs. $uri is the path only; no referrer either (Referrer-Policy is no-referrer anyway).
log_format sentinelx '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';

# Development and CI: plain http on 8080 (published on 127.0.0.1 only). The production
# configuration replaces this file with nginx-tls.conf (docker-compose.prod.yml).
server {
  listen 8080;
  include /etc/nginx/sentinelx/app.conf;
}
