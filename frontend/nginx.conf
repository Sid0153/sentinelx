server {
  listen 8080;
  server_tokens off;  # do not advertise the nginx version
  # Log ingestion (Phase 5) accepts batches up to 5 MB; everything else is small JSON.
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Log content shown in the UI is attacker-controlled (docs/security.md), so scripts may only
  # come from this origin. style-src allows 'unsafe-inline' because React sets some inline
  # styles; that cannot run code.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API calls are proxied to the backend container, so the browser only talks to one origin.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Single-page app: unknown paths fall back to index.html so React Router can handle them.
  location / {
    try_files $uri /index.html;
  }
}
