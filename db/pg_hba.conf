# PostgreSQL client authentication for Docker Compose (Phase 13, docs/security.md).
#
# Network connections must use TLS and a password (SCRAM-SHA-256); unencrypted ones are
# refused. The Unix socket inside the container (health check, `docker compose exec db psql`)
# needs no password, as in the official image's default: reaching it already requires
# control of the container.

# TYPE      DATABASE  USER  ADDRESS  METHOD
local       all       all            trust
hostssl     all       all   all      scram-sha-256
hostnossl   all       all   all      reject
