[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real PostgreSQL, set TEST_DATABASE_URL to run"]

[tool.coverage.run]
omit = ["alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import order, B bugbear, UP pyupgrade, S bandit-style security checks
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests build fixed SQL on purpose (constraint and index checks): S608 does not apply.
"tests/**" = ["S101", "S105", "S106", "S608"]
# Migrations are generated DDL; long CHECK constraints read better on one line.
"alembic/versions/**" = ["E501"]

[tool.ruff.lint.isort]
# The local ./alembic/ migrations folder would otherwise make ruff treat the alembic library
# as first-party code.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
