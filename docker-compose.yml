name: sentinelx

# No secrets live in this file. Values come from a local .env (copy .env.example).
# The ":?" form makes compose stop with a clear message if a required value is missing.
# Host ports are 5433 / 8001 / 8081 so SentinelX can run next to other local stacks that use
# the usual 5432 / 8000 / 8080. Every port is bound to 127.0.0.1 only.

# Container logs are rotated (Phase 15): at most 3 files of 10 MB per service, so a long-running
# stack cannot fill the disk. The application logs JSON to stdout (docs/deployment.md).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot: issues the database's TLS certificate (db/make-certs.sh) and exits. Uses the
  # pinned backend base image, which ships openssl. No network needed.
  db-certs:
    image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    entrypoint: ["sh", "/make-certs.sh"]
    network_mode: none
    volumes:
      - ./db/make-certs.sh:/make-certs.sh:ro
      - db_tls_ca:/out/ca
      - db_tls_server:/out/server
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN  # gives the server key to the postgres user
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging

  db:
    # The official image without gosu, OS packages updated (db/Dockerfile), run as postgres.
    build: ./db
    # TLS only for network connections (db/pg_hba.conf refuses unencrypted ones), TLS 1.3.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - db_tls_server:/tls:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      db-certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Hardening like the other containers (Phase 15): the postgres user (uid 70) from the
    # start, no privilege escalation, no capabilities, read-only filesystem except the data
    # volume, the socket directory and /tmp.
    user: "70:70"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # The application connects as a least-privilege role (rows only, no schema or trigger
      # changes); migrations and the role setup use the owner (docs/security.md).
      # TLS with the certificate checked against the local CA and the name "db".
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-sentinelx_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/tls-ca/ca.crt
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/tls-ca/ca.crt
      APP_DB_USER: ${APP_DB_USER:-sentinelx_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      # Only nginx (its fixed address below) may say who the client is. Requests that reach
      # the backend port directly arrive from the bridge gateway and are not trusted.
      # Add a TLS proxy in front of nginx here, keeping nginx's address (docs/deployment.md).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.10/32}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - db_tls_ca:/tls-ca:ro  # the CA certificate only, never the server key
    ports:
      - "127.0.0.1:8001:8000"
    # Hardening: no privilege escalation, no Linux capabilities, read-only filesystem
    # (only /tmp is writable, in memory).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "127.0.0.1:8081:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db_data:
  db_tls_ca:
  db_tls_server:
