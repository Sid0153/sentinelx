# Free public demo on Render (docs/deployment.md#free-public-deployment-render-and-neon): the
# real app with the SIMULATED demo environment and a read-only "Explore as guest". Database: a
# free Neon PostgreSQL project (Render's free PostgreSQL is deleted after 30 days).
#
# Service names become the public URLs. If Render reports a name as taken, pick another and
# update the /api/* rewrite below and CORS_ORIGINS to match.
services:
  - type: web
    name: sentinelx-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy only commits that passed CI
    previews:
      generation: off
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # random, generated by Render, never in the repository
      # Neon's owner connection string, entered once in the Render dashboard. It runs the
      # migrations and creates the application's least-privilege role; the app itself connects
      # as that role (DATABASE_URL is derived: same host, APP_DB_USER and APP_DB_PASSWORD).
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: APP_DB_USER
        value: sentinelx_app
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sentinelx-demo.onrender.com
      - key: GUEST_EMAIL
        value: guest@sentinelx.example
      - key: DEMO_AUTOLOAD # the demo story on the first start (an empty database only)
        value: "true"
      # Client address for rate limits and the audit log (app/core/client_ip.py): read
      # X-Forwarded-For from the right, skipping Render's internal network, Cloudflare and
      # Render's proxy (74.220.48.0/20, ARIN "Render"), as measured for CloudSentinel.
      - key: TRUSTED_PROXIES
        value: private, cloudflare, 74.220.48.0/20

  # The React app as a static site (does not sleep). /api/* is proxied to the backend, so the
  # browser talks to one origin and the SameSite=Strict refresh cookie keeps working.
  - type: web
    name: sentinelx-demo
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    previews:
      generation: off
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sentinelx-demo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # The headers nginx sends in the Docker setup (frontend/nginx/app.conf).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
